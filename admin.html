<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MooSweet - จัดการร้าน</title><link rel="stylesheet" href="style.css"></head><body><header>
<nav class="navbar">
  <a class="brand" href="index.html">🍓 <span>MooSweet</span></a>
  <div class="menu">
    <a href="index.html">หน้าแรก</a>
    <a href="index.html#products">สินค้า</a>
    <a href="about.html">เกี่ยวกับร้าน</a>
    <a href="contact.html">ติดต่อ</a>
    <a href="orders.html" id="ordersLink">คำสั่งซื้อ</a>
    <a href="admin.html" id="adminLink" class="admin-link" style="display:none">จัดการร้าน</a>
    <a href="login.html" id="authLink">เข้าสู่ระบบ</a>
    <button id="logoutBtn" class="logout-btn" type="button" onclick="logout()" style="display:none">ออกจากระบบ</button>
    <button class="cart-trigger" onclick="showCart()">🛒 <span>ตะกร้า</span> <b id="cartCount">0</b></button>
  </div>
</nav>
</header><main><section class="section admin-section"><div class="admin-head"><div><span class="eyebrow">BACK OFFICE</span><h2>จัดการร้าน</h2><p class="section-text">จัดการสินค้า สต็อก และสถานะคำสั่งซื้อ</p></div><span id="adminWelcome" class="status-pill"></span></div><div class="admin-tabs"><button class="admin-tab active" data-tab="products">📦 สินค้า</button><button class="admin-tab" data-tab="orders">🧾 คำสั่งซื้อ</button></div><div id="adminProductsPanel"><form id="productForm" class="admin-form"><input type="hidden" id="productId"><div class="form-grid"><label>ชื่อสินค้า<input id="pname" required></label><label>ราคา<input id="pprice" type="number" min="0" required></label><label>สต็อก<input id="pqty" type="number" min="0" required></label><label>หมวดหมู่<input id="pcat"></label></div><label>URL รูปภาพ<input id="pimage" placeholder="https://..."></label><label>รายละเอียด<textarea id="pdesc" rows="3"></textarea></label><div class="admin-form-actions"><button type="submit" class="main-btn">บันทึกสินค้า</button><button type="button" class="secondary-btn" onclick="resetProductForm()">ยกเลิก</button></div></form><div id="adminProducts" class="product-grid"></div></div><div id="adminOrdersPanel" style="display:none"><div id="adminOrders" class="orders-list"></div></div></section></main><footer><div><strong>MooSweet</strong><span>ขนมโฮมเมด ทำสดใหม่ทุกวัน</span></div><p>© 2026 MooSweet</p></footer>
<div id="cartBox" class="cart-box" aria-hidden="true">
  <div class="cart-head"><h2>ตะกร้าสินค้า</h2><button class="close" onclick="closeCart()" aria-label="ปิด">✕</button></div>
  <div id="cartItems">ยังไม่มีสินค้า</div>
  <div class="cart-summary"><span>รวมสินค้า</span><strong>฿<span id="cartTotal">0</span></strong></div>
  <button class="main-btn full" onclick="checkout()">ไปชำระเงิน</button>
</div>
<div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>
<script src="script.js"></script></body></html>
