<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MooSweet - ชำระเงิน</title><link rel="stylesheet" href="style.css"></head><body><header>
<nav class="navbar">
  <a class="brand" href="index.html">🍓 <span>MooSweet</span></a>
  <div class="menu">
    <a href="index.html">หน้าแรก</a>
    <a href="index.html#products">สินค้า</a>
    <a href="about.html">เกี่ยวกับร้าน</a>
    <a href="contact.html">ติดต่อ</a>
    <a href="orders.html" id="ordersLink">คำสั่งซื้อ</a>
    <a href="admin.html" id="adminLink" class="admin-link" style="display:none">จัดการร้าน</a>
    <a href="login.html" id="authLink">เข้าสู่ระบบ</a>
    <button id="logoutBtn" class="logout-btn" type="button" onclick="logout()" style="display:none">ออกจากระบบ</button>
    <button class="cart-trigger" onclick="showCart()">🛒 <span>ตะกร้า</span> <b id="cartCount">0</b></button>
  </div>
</nav>
</header><main><section class="section checkout-page"><div class="checkout-layout"><div class="checkout-form-card"><span class="eyebrow">CHECKOUT</span><h2>ข้อมูลจัดส่ง</h2><p class="section-text">กรอกข้อมูลให้ครบก่อนยืนยันคำสั่งซื้อ</p><form id="checkoutForm"><div class="form-grid"><label>ชื่อผู้รับ<input id="checkoutName" required></label><label>เบอร์โทรศัพท์<input id="checkoutPhone" type="tel" required></label></div><label>ที่อยู่จัดส่ง<textarea id="checkoutAddress" rows="4" required placeholder="บ้านเลขที่ ถนน ตำบล/แขวง อำเภอ/เขต จังหวัด รหัสไปรษณีย์"></textarea></label><label>วิธีชำระเงิน<select id="paymentMethod"><option value="cod">เก็บเงินปลายทาง</option><option value="bank_transfer">โอนเงิน</option></select></label><label>หมายเหตุ<textarea id="checkoutNote" rows="3" placeholder="เช่น ฝากไว้หน้าบ้าน / ไม่ใส่ถั่ว"></textarea></label><button class="main-btn full" type="submit">ยืนยันคำสั่งซื้อ</button></form></div><aside class="checkout-summary-card"><h3>สรุปคำสั่งซื้อ</h3><div id="checkoutItems"></div><div class="cart-summary"><span>ยอดรวม</span><strong>฿<span id="checkoutTotal">0</span></strong></div></aside></div></section></main><footer><div><strong>MooSweet</strong><span>ขนมโฮมเมด ทำสดใหม่ทุกวัน</span></div><p>© 2026 MooSweet</p></footer>
<div id="cartBox" class="cart-box" aria-hidden="true">
  <div class="cart-head"><h2>ตะกร้าสินค้า</h2><button class="close" onclick="closeCart()" aria-label="ปิด">✕</button></div>
  <div id="cartItems">ยังไม่มีสินค้า</div>
  <div class="cart-summary"><span>รวมสินค้า</span><strong>฿<span id="cartTotal">0</span></strong></div>
  <button class="main-btn full" onclick="checkout()">ไปชำระเงิน</button>
</div>
<div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>
<script src="script.js"></script></body></html>
